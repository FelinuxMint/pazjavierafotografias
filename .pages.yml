media: images/uploads
content:
  - name: proyectos
    label: Proyectos
    type: collection
    path: _projects
    fields:
      - name: title
        label: Título
        type: string
      - name: slug
        label: Slug (URL)
        type: string
      - name: order
        label: Orden en galería
        type: number
      - name: description
        label: Descripción
        type: text
      - name: featured_image
        label: Imagen destacada
        type: image
      - name: photos
        label: Fotos del proyecto
        type: object
        list: true
        fields:
          - name: imagen
            label: Imagen
            type: image
          - name: titulo
            label: Título de la foto
            type: string
  - name: biografia
    label: Biografía
    type: file
    path: biografia.md
    fields:
      - name: title
        label: Título
        type: string
      - name: layout
        type: string
        hidden: true
        default: page.njk
      - name: permalink
        type: string
        hidden: true
        default: biografia.html
      - name: body
        label: Contenido
        type: rich-text
        options:
          format: markdown
  - name: contacto
    label: Contacto
    type: file
    path: contacto.md
    fields:
      - name: title
        label: Título
        type: string
      - name: layout
        type: string
        hidden: true
        default: page.njk
      - name: permalink
        type: string
        hidden: true
        default: contacto.html
      - name: body
        label: Contenido
        type: rich-text
        options:
          format: markdown
  - name: exposiciones
    label: Exposiciones
    type: file
    path: exposiciones.md
    fields:
      - name: title
        label: Título
        type: string
      - name: layout
        type: string
        hidden: true
        default: page.njk
      - name: permalink
        type: string
        hidden: true
        default: exposiciones.html
      - name: body
        label: Contenido
        type: rich-text
        options:
          format: markdown
